<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Scout Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0a0f1a;
            --card: #161d2b;
            --accent: #e58e26;
            --border: #1e293b;
            --text: #f1f5f9;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background-color: rgba(22, 29, 43, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="pb-24 selection:bg-amber-500/30">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 px-6 py-5 border-b border-[#1e293b] bg-[#0f172a]/95 backdrop-blur-md flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-4">
            <div class="bg-[#1e293b] p-2 rounded-2xl border border-[#2d3748] shadow-xl relative">
                <i data-lucide="fingerprint" class="w-6 h-6 text-[#e58e26]"></i>
                <i data-lucide="shield-alert" class="w-3 h-3 text-red-500 absolute -bottom-1 -right-1"></i>
            </div>
            <div>
                <h1 class="text-xl font-black uppercase italic tracking-tighter leading-none">Prompt Scout <span class="text-[#e58e26]">Flow</span></h1>
                <p class="text-[8px] font-black uppercase tracking-[0.3em] text-slate-500 mt-1">Light Physics & Materials Node</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="window.toggleVideoModal(true)" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-[10px] font-black uppercase transition-all bg-[#1e293b] text-[#e58e26] hover:bg-[#e58e26] hover:text-white border border-[#2d3748] shadow-lg">
                <i data-lucide="play-circle" class="w-4 h-4"></i> <span class="hidden sm:inline">Introduktion: Hur appen fungerar</span>
            </button>
            <nav class="bg-[#161d2b] p-1.5 rounded-2xl flex border border-[#2d3748] gap-1">
                <button onclick="window.setActiveTab('search')" id="tab-search" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all bg-[#2d3748] text-[#e58e26]">Design</button>
                <button onclick="window.setActiveTab('vault')" id="tab-vault" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all text-slate-500 hover:text-slate-300">Arkiv</button>
            </nav>
        </div>
    </header>

    <!-- MAIN APP WRAPPER -->
    <main class="max-w-[1450px] mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- LEFT: CHARACTER MANAGER -->
        <div class="lg:col-span-3 space-y-6">
            <div class="glass-panel p-6 rounded-[2.5rem] border-2 border-amber-500/10 shadow-xl">
                <h3 class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2 mb-6 text-slate-400">
                    <i data-lucide="users" class="w-4 h-4 text-[#e58e26]"></i> Karaktärs-ID
                </h3>
                
                <div id="character-list" class="space-y-4">
                    <!-- Fylls dynamiskt -->
                    <p class="text-[9px] text-slate-600 italic text-center py-4 uppercase font-bold">Inga karaktärer hittade</p>
                </div>
                
                <div id="mix-character-container" class="mt-4 pt-4 border-t border-[#1e293b] hidden">
                    <!-- Fylls dynamiskt -->
                </div>

                <div class="mt-6 pt-6 border-t border-[#1e293b] space-y-3">
                    <button id="add-photo-btn" onclick="document.getElementById('file-input').click()" class="w-full py-4 rounded-2xl bg-[#1e293b] text-[#e58e26] border border-[#e58e26]/20 font-black text-[9px] uppercase hover:bg-[#e58e26] hover:text-white transition-all flex items-center justify-center gap-2">
                        <i data-lucide="camera" class="w-4 h-4" id="photo-btn-icon"></i> <span id="photo-btn-text">Infoga nya foton</span>
                    </button>
                    <input type="file" id="file-input" onchange="window.handleImageChange(event)" class="hidden" accept="image/*" multiple />
                </div>
            </div>

            <div class="glass-panel p-6 rounded-[2.5rem] border-2 border-blue-500/10 shadow-xl">
                <h3 class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2 mb-4 text-slate-400">
                    <i data-lucide="file-json" class="w-4 h-4 text-blue-400"></i> JSON Port
                </h3>
                <button onclick="document.getElementById('json-input').click()" class="w-full py-3 rounded-xl bg-[#0a0f1a] text-blue-400 border border-blue-400/20 font-black text-[9px] uppercase hover:bg-blue-400 hover:text-white transition-all flex items-center justify-center gap-2">
                    <i data-lucide="upload" class="w-3 h-3"></i> Ladda upp JSON
                </button>
                <input type="file" id="json-input" onchange="window.handleJsonImport(event)" class="hidden" accept="application/json" />
            </div>
        </div>

        <!-- CENTER: SEARCH & RESULTS -->
        <div class="lg:col-span-6 space-y-6">
            
            <!-- SEARCH TAB CONTENT -->
            <div id="view-search" class="space-y-6 block">
                <div class="glass-panel p-8 rounded-[3rem] border-2 shadow-2xl border-amber-500/10">
                    <div id="category-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-2 mb-8">
                        <!-- Kategorier renderas här -->
                    </div>

                    <div class="space-y-4">
                        <div class="relative">
                            <i data-lucide="tag" class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-[#e58e26]"></i>
                            <input type="text" id="keyword-input" placeholder="Sök förvandling (Enter)..." 
                                class="w-full pl-14 pr-32 py-5 border-2 rounded-[2rem] bg-[#0a0f1a] border-[#1e293b] focus:border-[#e58e26] outline-none font-bold text-white shadow-inner"
                                onkeypress="if(event.key === 'Enter') window.addKeyword()"
                            />
                            <button onclick="window.handleSurpriseMe()" id="surprise-btn" class="absolute right-3 top-1/2 -translate-y-1/2 p-3 bg-[#1e293b] text-[#e58e26] hover:bg-[#e58e26] hover:text-white rounded-[1.5rem] transition-all flex items-center gap-2">
                                <i data-lucide="dices" class="w-4 h-4" id="surprise-icon"></i>
                                <span class="text-[9px] font-black uppercase hidden md:inline">Överraska</span>
                            </button>
                        </div>

                        <div id="keywords-list" class="flex flex-wrap gap-2"></div>
                        
                        <div id="suggestions-container" class="pt-2 animate-in hidden">
                            <div class="flex items-center gap-2 mb-3">
                                <i data-lucide="sparkles" class="w-3 h-3 text-[#e58e26]"></i>
                                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest italic">Anpassade förslag</span>
                            </div>
                            <div id="suggestions-list" class="flex flex-wrap gap-2"></div>
                        </div>

                        <button onclick="window.handleSearch()" id="search-btn" class="w-full py-6 rounded-[2.5rem] bg-[#e58e26] text-white font-black text-xl shadow-xl hover:opacity-90 transition-all flex items-center justify-center gap-4">
                            <i data-lucide="search"></i> SÖK REALISTISKA VAL
                        </button>
                    </div>
                </div>

                <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-10">
                    <!-- Sökresultat -->
                </div>
            </div>

            <!-- VAULT TAB CONTENT -->
            <div id="view-vault" class="space-y-6 hidden">
                <div class="flex justify-between items-center mb-4 px-4">
                    <h2 class="text-xl font-black uppercase italic tracking-tighter">Mitt Valv</h2>
                    <button onclick="window.exportVault()" class="flex items-center gap-2 text-[10px] font-black text-blue-400 hover:text-white uppercase">
                        <i data-lucide="download" class="w-4 h-4"></i> Exportera
                    </button>
                </div>
                <div id="vault-list" class="grid gap-6">
                    <!-- Valv-items -->
                </div>
            </div>

        </div>

        <!-- RIGHT: SEQUENCE & MASTER -->
        <div class="lg:col-span-3 space-y-6">
            <div class="glass-panel p-6 rounded-[2.5rem] border-2 border-amber-500/20 sticky top-32 shadow-2xl">
                <h3 class="font-black text-[10px] uppercase tracking-widest flex items-center gap-2 mb-6">
                    <i data-lucide="layers" class="w-4 h-4 text-[#e58e26]"></i> Aktiv Sekvens
                </h3>
                
                <div id="sequence-list" class="space-y-3 mb-6 max-h-[350px] overflow-y-auto custom-scrollbar pr-2">
                    <!-- Sekvenser renderas här -->
                    <p class="text-[8px] text-slate-600 text-center py-10 font-bold uppercase tracking-widest italic border-2 border-dashed border-slate-800 rounded-3xl">Inga steg tillagda</p>
                </div>

                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-[8px] font-black uppercase text-slate-500 tracking-widest flex items-center gap-2">
                            <i data-lucide="map-pin" class="w-3 h-3 text-[#e58e26]"></i> Händelse & Miljö
                        </label>
                        <textarea id="event-desc" placeholder="Beskriv scenens ljus och arkitektur..." onchange="window.state.eventDescription = this.value" class="w-full p-4 bg-[#0a0f1a] border-2 border-[#1e293b] rounded-2xl text-[10px] font-medium focus:border-[#e58e26] outline-none min-h-[80px] text-slate-300 resize-none shadow-inner"></textarea>
                        
                        <div class="flex items-center gap-3 mt-2">
                            <button id="event-img-btn" onclick="window.toggleEventImage()" class="flex-1 py-3 rounded-xl border-2 font-black text-[9px] uppercase transition-all flex items-center justify-center gap-2 bg-[#1e293b] border-[#2d3748] text-[#e58e26]">
                                <i data-lucide="image" class="w-3 h-3"></i> Miljöbild
                            </button>
                            <input type="file" id="event-img-input" onchange="window.handleEventImageChange(event)" class="hidden" accept="image/*" />
                            <div id="event-img-preview" class="hidden w-10 h-10 rounded-lg overflow-hidden border border-[#e58e26] flex-shrink-0">
                                <img id="event-img-element" src="" class="w-full h-full object-cover" alt="Miljö" />
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="window.generateMasterPrompt()" id="master-prompt-btn" disabled class="w-full py-5 rounded-[2rem] bg-white text-black font-black text-[9px] uppercase tracking-[0.2em] shadow-xl hover:bg-[#e58e26] hover:text-white transition-all disabled:opacity-30 flex items-center justify-center gap-2 mt-4">
                        <i data-lucide="wand-2" class="w-4 h-4"></i> GENERERA MASTER PROMPT
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODALS AND OVERLAYS -->
    <div id="modals-container"></div>

    <!-- GLOBAL LOADING -->
    <div id="global-loading" class="fixed inset-0 bg-black/90 backdrop-blur-3xl z-[150] flex flex-col items-center justify-center hidden">
        <i data-lucide="refresh-cw" class="w-16 h-16 animate-spin text-[#e58e26] mb-4"></i>
        <p class="font-black uppercase tracking-[0.4em] text-white animate-pulse">Neural Synchronization...</p>
    </div>

    <!-- COPY FEEDBACK -->
    <div id="copy-feedback" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-[200] px-8 py-4 bg-green-500 text-white rounded-full font-black uppercase tracking-widest text-xs shadow-2xl items-center gap-3 hidden animate-in">
        <i data-lucide="check" class="w-5 h-5"></i> Kopierat till Urklipp
    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, deleteDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        let GEMINI_API_KEY = "AQ.Ab8RN6IZJiZA31UruALAc73VDZLpj9OewC2QRjHsgtYVBRV_2Q"; // Din inlagda Gemini API-nyckel
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'prompt-scout-flow-v1'; 
        
        let app, auth, db;
        
        // Förhindra krasch på externa sidor (t.ex. GitHub Pages) där Firebase-config saknas
        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } catch(e) { console.warn("Firebase Init Error:", e); }
        } else {
            console.warn("Appen körs i offline-läge utan Firebase. Moln-synken är inaktiverad.");
        }

        const CATEGORIES = [
          { id: 'human', label: 'Stil & Mänsklighet', icon: 'user' },
          { id: 'fantasy', label: 'Fantasy & Saga', icon: 'ghost' },
          { id: 'animal', label: 'Djurisk Metamorfos', icon: 'dog' },
          { id: 'horror', label: 'Skräck & Horror', icon: 'skull' },
          { id: 'popculture', label: 'Pop & Sci-Fi', icon: 'clapperboard' },
          { id: 'alien', label: 'Xenobiologi & Alien', icon: 'dna' },
          { id: 'humor', label: 'Humor & Komedi', icon: 'smile' },
        ];

        // --- STATE MANAGEMENT ---
        const state = {
            user: null,
            activeTab: 'search',
            currentKeywords: [],
            selectedCat: 'fantasy',
            suggestions: [],
            results: [],
            savedPrompts: [],
            sequence: [],
            base64Images: [],
            eventDescription: '',
            eventImage: null,
            mixCharacters: false,
            characters: [],
            selectedTarget: 'Alla',
            pendingCharacters: null,
            modalContent: null,
            showVideoModal: false
        };
        window.state = state; // Expose for inline handlers if needed

        // --- UTILS & RENDERERS ---
        const safeRender = (elementId, htmlString) => {
            const el = document.getElementById(elementId);
            if(el) {
                el.innerHTML = htmlString;
                lucide.createIcons({root: el});
            }
        };

        const showEl = (id, show) => {
            const el = document.getElementById(id);
            if(el) show ? el.classList.remove('hidden') : el.classList.add('hidden');
        };

        // --- API ENGINE ---
        const callGemini = async (prompt, systemInstruction = "", images = []) => {
            if (!GEMINI_API_KEY || GEMINI_API_KEY === "") {
                GEMINI_API_KEY = window.prompt("Vänligen ange din Google Gemini API-nyckel för att generera alternativ (Skaffas gratis via Google AI Studio):");
                if (!GEMINI_API_KEY) {
                    showEl('global-loading', false);
                    throw new Error("Ingen API-nyckel angiven.");
                }
            }
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`;
            const parts = [{ text: prompt }];
            images.forEach(img => {
                if (img) parts.push({ inlineData: { mimeType: "image/png", data: img.split(',')[1] } });
            });
            const payload = {
                contents: [{ role: "user", parts }],
                systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < delays.length; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (e) {
                    if (i === delays.length - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        };

        // --- FIREBASE SYNC ---
        let vaultUnsubscribe = null;
        const setupFirestore = () => {
            if (!state.user || !db) return;
            if(vaultUnsubscribe) vaultUnsubscribe();
            
            const q = collection(db, 'artifacts', appId, 'users', state.user.uid, 'vault');
            vaultUnsubscribe = onSnapshot(q, (snapshot) => {
                state.savedPrompts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderVault();
            }, (err) => console.error("Cloud Sync Error:", err));
        };

        const initAuth = async () => {
            if (!auth) return;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch(e) { console.error("Auth failed:", e); }
        };
        
        if (auth) {
            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if(user) setupFirestore();
            });
            initAuth();
        }

        // --- RENDER LOGIC ---
        const renderCategories = () => {
            let html = CATEGORIES.map(cat => `
                <button onclick="window.setSelectedCat('${cat.id}')" class="flex flex-col items-center gap-2 p-3 rounded-2xl border-2 transition-all ${state.selectedCat === cat.id ? 'bg-[#1e293b] border-[#e58e26]' : 'bg-[#0f172a] border-transparent text-slate-500'}">
                    <i data-lucide="${cat.icon}" class="w-4 h-4"></i>
                    <span class="text-[8px] font-black uppercase text-center">${cat.label}</span>
                </button>
            `).join('');
            safeRender('category-grid', html);
        };

        const renderKeywords = () => {
            let html = state.currentKeywords.map(word => `
                <span class="px-4 py-2 rounded-xl bg-[#1e293b] text-[#e58e26] text-[9px] font-black uppercase flex items-center gap-2 border border-[#2d3748]">
                    ${word} <i data-lucide="x" class="w-3 h-3 cursor-pointer" onclick="window.removeKeyword('${word}')"></i>
                </span>
            `).join('');
            safeRender('keywords-list', html);
        };

        const renderSuggestions = () => {
            showEl('suggestions-container', state.suggestions.length > 0);
            let html = state.suggestions.map(s => `
                <button onclick="window.addSuggestion('${s}')" class="px-4 py-2 rounded-xl border border-[#2d3748] bg-[#0f172a] text-slate-400 text-[10px] font-bold uppercase hover:bg-[#1e293b] hover:text-[#e58e26] transition-all">+ ${s}</button>
            `).join('');
            safeRender('suggestions-list', html);
        };

        const renderCharacters = () => {
            const masterBtn = document.getElementById('master-prompt-btn');
            if (masterBtn) masterBtn.disabled = state.characters.length === 0;

            if (state.characters.length === 0) {
                safeRender('character-list', `<p class="text-[9px] text-slate-600 italic text-center py-4 uppercase font-bold">Inga karaktärer hittade</p>`);
                showEl('mix-character-container', false);
                return;
            }

            let html = state.characters.map(char => `
                <div class="p-4 bg-[#0a0f1a] rounded-3xl border transition-all ${char.isOriginal ? 'border-[#e58e26]' : 'border-[#1e293b]'}">
                    <div class="flex items-center gap-4 relative group">
                        <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-[#e58e26] flex-shrink-0">
                            <img src="${char.img}" class="w-full h-full object-cover" alt="Thumb" />
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col justify-center gap-1">
                            <input type="text" 
                                class="bg-transparent border-none text-[10px] font-black uppercase outline-none text-slate-200 focus:text-white w-full truncate"
                                value="${char.name}"
                                onchange="window.updateCharName('${char.id}', this.value)" />
                            <input type="text" 
                                placeholder="Pose (t.ex. sitter ner)..."
                                class="bg-transparent border-none text-[9px] italic outline-none text-slate-500 focus:text-amber-500 w-full truncate"
                                value="${char.pose || ''}"
                                onchange="window.updateCharPose('${char.id}', this.value)" />
                        </div>
                        <div class="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-all">
                            <button onclick="window.duplicateChar('${char.id}')" class="p-1.5 text-blue-400 hover:text-blue-300 bg-blue-500/10 rounded-lg transition-colors">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="window.removeChar('${char.id}')" class="p-1.5 text-red-500 hover:text-red-400 bg-red-500/10 rounded-lg transition-colors">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-[#1e293b] flex items-center justify-between">
                        <div onclick="window.toggleCharOriginal('${char.id}')" class="flex items-center gap-2 cursor-pointer group">
                            <div class="w-4 h-4 rounded flex items-center justify-center border transition-all ${char.isOriginal ? 'bg-[#e58e26] border-[#e58e26]' : 'border-slate-600 group-hover:border-slate-400'}">
                                ${char.isOriginal ? '<i data-lucide="check" class="w-3 h-3 text-white"></i>' : ''}
                            </div>
                            <span class="text-[8px] font-black uppercase tracking-widest transition-colors ${char.isOriginal ? 'text-[#e58e26]' : 'text-slate-500 group-hover:text-slate-300'}">
                                Behåll Original
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
            safeRender('character-list', html);

            // Mix Checkbox
            if (state.characters.length > 1) {
                let mixHtml = `
                    <div onclick="window.toggleMix()" class="flex items-center gap-3 cursor-pointer group">
                        <div class="w-5 h-5 rounded flex items-center justify-center border transition-all ${state.mixCharacters ? 'bg-[#e58e26] border-[#e58e26]' : 'border-slate-600 group-hover:border-slate-400'}">
                            ${state.mixCharacters ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[9px] font-black uppercase tracking-widest transition-colors flex items-center gap-2 ${state.mixCharacters ? 'text-[#e58e26]' : 'text-slate-300'}">
                                <i data-lucide="blend" class="w-3 h-3"></i> Hybrid-Fusion (Mixa)
                            </span>
                            <span class="text-[8px] text-slate-500 italic mt-0.5">Sökord & prompt anpassas för att smälta samman.</span>
                        </div>
                    </div>
                `;
                safeRender('mix-character-container', mixHtml);

        const renderVault = () => {

        const renderModals = () => {

                            ${state.modalContent.negativeContent ? `<button onclick="window.copyToClipboard(\`${state.modalContent.negativeContent.replace(/`/g, "\\`")}\`)" class="flex-[3] py-6 rounded-[2rem] bg-[#1e293b] text-red-400 border-2 border-red-500/30 font-black text-sm uppercase tracking-widest">Kopiera Negativ</button>` : ''}
                            ${state.modalContent.raw ? `<button onclick="window.saveToVault()" class="flex-1 py-6 rounded-[2rem] bg-[#1e293b] text-[#e58e26] border-2 border-[#e58e26]/30 font-black flex items-center justify-center hover:bg-[#e58e26] hover:text-white transition-all"><i data-lucide="save" class="w-6 h-6"></i></button>` : ''}
                        </div>
                    </div>
                </div>`;

                            <h3 class="text-xl font-black text-[#e58e26] uppercase italic flex items-center gap-3"><i data-lucide="play-circle" class="w-6 h-6"></i> System Guide</h3>
                            <button onclick="window.toggleVideoModal(false)" class="p-3 hover:bg-slate-800 rounded-full text-slate-500 transition-all"><i data-lucide="x" class="w-8 h-8"></i></button>

                        </div>
                    </div>

            safeRender('modals-container', html);
        };

        // --- ACTIONS EXPOSED TO WINDOW ---
        window.setActiveTab = (tab) => {

            showEl('view-search', tab === 'search');
            showEl('view-vault', tab === 'vault');
        };

        window.setSelectedCat = (catId) => {
            state.selectedCat = catId;
            renderCategories();
            triggerSuggestionsFetch();
        };

        window.addKeyword = () => {
            const input = document.getElementById('keyword-input');
            const word = input.value.trim().toLowerCase();
            if (word && !state.currentKeywords.includes(word)) {
                state.currentKeywords.push(word);
                input.value = '';
                renderKeywords();
                triggerSuggestionsFetch();
            }
        };

        window.removeKeyword = (word) => {
            state.currentKeywords = state.currentKeywords.filter(w => w !== word);
            renderKeywords();
            triggerSuggestionsFetch();
        };

        window.addSuggestion = (word) => {
            if (!state.currentKeywords.includes(word)) {
                state.currentKeywords.push(word);
                renderKeywords();
                triggerSuggestionsFetch();
            }
        };

        // Fetch suggestions (debounced)
        let debounceTimer;
        const triggerSuggestionsFetch = () => {
            clearTimeout(debounceTimer);
            if (state.currentKeywords.length === 0 && state.base64Images.length === 0) {
                state.suggestions = [];
                renderSuggestions();
                return;
            }
            debounceTimer = setTimeout(async () => {
                const activeCat = CATEGORIES.find(c => c.id === state.selectedCat)?.label;
                let promptContext = state.currentKeywords.length > 0 
                    ? `Användarens sökord: [${state.currentKeywords.join(", ")}]. Bygg vidare och anpassa efter exakta temat. Föreslå 8 kompletterande ord.` 
                    : `Ge 8 passande sökord för att starta en förvandling.`;
                
                const prompt = `${promptContext} Tema "${activeCat}". Svara ENDAST med komma-separerad lista. Inga obskyra termer.`;
                try {
                    const res = await callGemini(prompt, "", state.base64Images.slice(0, 3));
                    if (res) {
                        state.suggestions = res.replace(/\n/g, '').split(',').map(s => s.trim().toLowerCase()).filter(s => s && !state.currentKeywords.includes(s)).slice(0, 8);
                        renderSuggestions();
                    }
                } catch (e) { console.error("Suggestions error", e); }
            }, 1200);
        };

        window.handleSearch = async () => {
            window.addKeyword(); // Catch any pending input
            if (state.base64Images.length === 0 && state.currentKeywords.length === 0) return;
            
            showEl('global-loading', true);
            const activeCat = CATEGORIES.find(c => c.id === state.selectedCat)?.label;
            const systemPrompt = `Du är expert på FOTOREALISTISK bild-transformation.
            UPPGIFT: Skapa 6 förvandlingar utifrån sökord för kategori ${activeCat}.
            Svara ENDAST JSON: {"options": [{"title": "Namn", "desc": "Beskrivning", "promptChunk": "Teknisk instruktion", "style": "Stil"}]}`;

            try {
                const res = await callGemini(`Skapa 6 förvandlingar: ${state.currentKeywords.join(", ")}`, systemPrompt, state.base64Images);
                const parsed = JSON.parse(res.replace(/```json|```/g, '').trim());
                state.results = parsed.options || [];
                renderResults();
            } catch (e) { console.error(e); }
            showEl('global-loading', false);
        };

        window.handleSurpriseMe = async () => {
            showEl('global-loading', true);
            const activeCat = CATEGORIES.find(c => c.id === state.selectedCat)?.label;
            try {
                const res = await callGemini(`Ge 3 extremt kreativa och episka sökord för "${activeCat}". ENDAST komma-separerad lista.`);
                if (res) {
                    const words = res.replace(/\n/g, '').split(',').map(s => s.trim().toLowerCase()).filter(s => s);
                    words.forEach(w => { if(!state.currentKeywords.includes(w)) state.currentKeywords.push(w); });
                    renderKeywords();
                    triggerSuggestionsFetch();
                }
            } catch (e) { console.error(e); }
            showEl('global-loading', false);
        };

        // --- CHARACTER LOGIC ---
        window.handleImageChange = async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            showEl('global-loading', true);
            let allDetected = [];
            for (const file of files) {
                const imgData = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
                try {
                    const res = await callGemini(`Hur många karaktärer i bilden? Svara ENDAST JSON: {"detected": [{"name": "Namn"}]}`, "Visuell analys.", [imgData]);
                    const parsed = JSON.parse(res.replace(/```json|```/g, '').trim());
                    allDetected.push({ imgData, characters: parsed.detected?.map(d => ({ ...d, selected: true, tempId: crypto.randomUUID() })) || [{ name: "Karaktär", selected: true, tempId: crypto.randomUUID() }] });
                } catch (err) {
                    allDetected.push({ imgData, characters: [{ name: "Okänd Karaktär", selected: true, tempId: crypto.randomUUID() }] });
                }
            }
            state.pendingCharacters = allDetected;
            renderModals();
            showEl('global-loading', false);
            e.target.value = ''; // reset
        };

        window.togglePendingChar = (tempId) => {
            state.pendingCharacters.forEach(group => {
                const c = group.characters.find(char => char.tempId === tempId);
                if(c) c.selected = !c.selected;
            });
            renderModals();
        };

        window.cancelPendingChars = () => { state.pendingCharacters = null; renderModals(); };
        
        window.confirmCharacters = () => {
            let newChars = [];
            state.pendingCharacters.forEach(group => {
                let added = false;
                group.characters.forEach(c => {
                    if (c.selected) {
                        newChars.push({ id: crypto.randomUUID(), name: c.name, img: group.imgData, pose: '', isOriginal: false });
                        added = true;
                    }
                });
                if (added && !state.base64Images.includes(group.imgData)) state.base64Images.push(group.imgData);
            });
            state.characters.push(...newChars);
            state.pendingCharacters = null;
            renderCharacters();
            renderResults(); // Update selects
            renderModals();
            triggerSuggestionsFetch();
        };

        window.updateCharName = (id, val) => { const c = state.characters.find(c=>c.id===id); if(c) c.name = val; renderResults(); };
        window.updateCharPose = (id, val) => { const c = state.characters.find(c=>c.id===id); if(c) c.pose = val; };
        window.duplicateChar = (id) => { 
            const c = state.characters.find(c=>c.id===id); 
            if(c) { state.characters.push({...c, id: crypto.randomUUID(), name: `${c.name} (Klon)`, isOriginal: false}); renderCharacters(); renderResults(); }
        };
        window.removeChar = (id) => {
            const char = state.characters.find(c => c.id === id);
            if (!char) return;
            state.characters = state.characters.filter(c => c.id !== id);
            if (state.characters.filter(c => c.img === char.img).length === 0) {
                state.base64Images = state.base64Images.filter(img => img !== char.img);
            }
            state.sequence = state.sequence.filter(s => s.target !== char.name);
            renderCharacters();
            renderSequence();
            renderResults();
        };
        window.toggleCharOriginal = (id) => { const c = state.characters.find(c=>c.id===id); if(c) {c.isOriginal = !c.isOriginal; renderCharacters();} };
        window.toggleMix = () => { state.mixCharacters = !state.mixCharacters; renderCharacters(); };

        window.toggleEventImage = () => {

                showEl('event-img-preview', false);

                btn.innerHTML = '<i data-lucide="image" class="w-3 h-3"></i> Miljöbild';

                    document.getElementById('event-img-element').src = state.eventImage;

                reader.readAsDataURL(file);

            if (state.characters.length === 0) return;

            let envInstruction = "MILJÖ: Solid svart bakgrund (#000000). Karaktärerna befinner sig i ett mörkt vakuum.";
            if (state.eventDescription || state.eventImage) {
                envInstruction = `MILJÖ & HÄNDELSE: ${state.eventDescription ? state.eventDescription : "En fotorealistisk miljö."} ${state.eventImage ? "Analysera ljuset och arkitekturen i miljöbilden noggrant." : ""}`;
            }

            const charList = state.characters.map(c => {
                const charSeq = state.sequence.filter(s => s.target === c.name || s.target === 'Alla');
                let text = `- ${c.name}: `;
                if (c.isOriginal) text += "EXAKT ANSIKTE och mänskligt utseende från originalbilden (HELT OFÖRÄNDRAD). ";

                else text += "Standard fotorealistisk version. ";
                if (c.pose) text += `Agerande: ${c.pose}.`;
                return text;
            }).join("\n    ");

            const masterSystemPrompt = `Du är Master Architect för Gemini Flow.
            UPPGIFT: Skapa en sammanhängande Master Prompt och en Negative Prompt.
            HYBRID: ${state.mixCharacters ? "Slå ihop karaktärerna till EN hybridvarelse." : "Behåll dem som separata individer."}
            KARAKTÄRER:
            ${charList}
            ${envInstruction}
            Svara ENDAST JSON: {"positive": "Svensk master prompt", "negative": "Engelsk negative prompt"}`;

            try {
                const imgs = [...state.base64Images];

            setTimeout(() => fb.classList.add('hidden'), 2000);
        };

        window.saveToVault = async () => {
            if(!state.user || !state.modalContent.raw) return;
            if(!db) { alert("Kan inte spara till valv eftersom databasen (Firebase) inte är ansluten på denna domän."); return; }
            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'vault'), {
                    title: state.modalContent.raw.title,
                    content: state.modalContent.content,
                    negativeContent: state.modalContent.negativeContent,
                    createdAt: new Date().toISOString()
                });
                window.closeModal();
            } catch(e) { console.error(e); }
        };

        window.deletePrompt = async (id) => {
            if(!state.user || !db) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'vault', id));
        };

        window.exportSingle = (id) => {
            const p = state.savedPrompts.find(p => p.id === id);
            if(p) downloadJson(p, p.title);
        };
        window.exportVault = () => downloadJson(state.savedPrompts, 'Prompt_Vault_Export');
        
        const downloadJson = (data, filename) => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = `${filename.replace(/\s+/g, '_')}.json`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        window.handleJsonImport = (e) => {
            if (!state.user || !db) {
                alert("Databasen (Firebase) är inte konfigurerad. Kan inte importera JSON till valvet.");
                return;
            }
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    const vaultRef = collection(db, 'artifacts', appId, 'users', state.user.uid, 'vault');
                    if (Array.isArray(importedData)) {
                        for (const item of importedData) await addDoc(vaultRef, { ...item, createdAt: new Date().toISOString() });
                    } else {
                        await addDoc(vaultRef, { ...importedData, createdAt: new Date().toISOString() });
                    }
                } catch (err) { console.error("JSON Import Error:", err); }
            };
            reader.readAsText(file);
            e.target.value = '';
        };

        // --- INIT RENDER ---
        renderCategories();
        lucide.createIcons();
    </script>
</body>
</html>
